<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحقق من الفاتورة — مطابخ الجنوب</title>
<meta name="theme-color" content="#943B25">
<link rel="icon" href="../pos/icons/favicon.png">
<link rel="stylesheet" href="../pos/fonts/cairo.css?v=25">
<style>
  /* Public page reached by scanning the QR on a printed invoice: shows the invoice as the restaurant
     recorded it, so the checker can compare it with the paper. No sign-in, nothing about the customer. */
  :root{--brand:#943B25;--ink:#2A211D;--muted:#6A5E55;--line:#DDD6CF;--paper:#FDFBFA;--bg:#F3ECE6;
        --ok:#1E7A4B;--ok-bg:#E7F4EC;--warn:#9A6514;--warn-bg:#FBF2E0;--bad:#A52A26;--bad-bg:#FBEAE9}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;padding:16px;background:var(--bg);font-family:'Cairo',Tahoma,sans-serif;color:var(--ink)}
  .card{max-width:460px;margin:4vh auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 40px -24px rgba(87,35,23,.45)}
  .state{display:flex;gap:12px;align-items:center;padding:16px 18px;font-weight:800;line-height:1.5}
  .state .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none;color:#fff}
  .state small{display:block;font-weight:500;font-size:12.5px}
  .ok{background:var(--ok-bg);color:var(--ok);font-size:20px} .ok .ic{background:var(--ok);width:44px;height:44px;font-size:24px}
  .warn{background:var(--warn-bg);color:var(--warn)} .warn .ic{background:var(--warn)}
  .bad{background:var(--bad-bg);color:var(--bad)} .bad .ic{background:var(--bad)}
  .wait{background:#EFE8E2;color:var(--muted)} .wait .ic{background:var(--muted)}
  .head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px dashed var(--line)}
  .mark{width:44px;height:44px;border-radius:50%;background:#2C1A14;color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;letter-spacing:1px;flex:none}
  .head b{display:block;font-size:15.5px;font-weight:800;line-height:1.35}
  .head span{display:block;font-size:11.5px;color:var(--muted)}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:14px 18px;font-size:13px;border-bottom:1px dashed var(--line)}
  .meta i{display:block;font-style:normal;font-size:11px;color:var(--muted)}
  .meta b{font-weight:700}
  .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:11px;color:var(--muted);font-weight:700;text-align:right;padding:9px 18px 6px;border-bottom:1px solid var(--line)}
  td{padding:8px 18px;border-bottom:1px solid #EEE7E1;vertical-align:top}
  td small{display:block;font-size:11px;color:var(--muted);direction:ltr;text-align:right}
  th.n,td.n{text-align:left;white-space:nowrap}
  .sum{padding:10px 18px 14px;font-size:13px}
  .sum div{display:flex;justify-content:space-between;padding:3px 0}
  .sum .total{margin-top:6px;padding-top:9px;border-top:2px solid var(--ink);font-size:17px;font-weight:800}
  .foot{padding:12px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);text-align:center;line-height:1.8}
  .foot code{font-family:Consolas,monospace;color:var(--ink)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="state wait" id="state"><span class="ic">…</span><span>جاري التحقق… <small>Checking…</small></span></div>
  <div id="invoice" hidden>
    <div class="head"><div class="mark">STDK</div>
      <div><b id="nameAr"></b><span id="nameEn"></span><span id="cr"></span></div></div>
    <div class="meta" id="meta"></div>
    <table><thead><tr><th>الصنف · Item</th><th class="n">الكمية · Qty</th><th class="n">المبلغ · QAR</th></tr></thead>
      <tbody id="items"></tbody></table>
    <div class="sum" id="sum"></div>
  </div>
  <div class="foot">يتحقق من الفاتورة مع سجل المطعم المحفوظ على الإنترنت<br>Checked against the restaurant&rsquo;s online records<span id="fp"></span></div>
</main>
<script>
'use strict';
const BASE = 'https://descriptive-poodle-579.convex.cloud';
const q = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Number(n || 0).toFixed(2);
const ICON = { ok: '✓', warn: '!', bad: '✕', wait: '…' };
const show = (cls, ar, en) => {
  const el = $('#state'); el.className = 'state ' + cls;
  el.innerHTML = `<span class="ic">${ICON[cls]}</span><span>${esc(ar)} <small>${esc(en)}</small></span>`;
};
const PAY = { card: 'بطاقة · Card', cash: 'نقداً · Cash', credit: 'على الحساب · Credit' };

(async () => {
  const uid = q.get('u'), hash = q.get('h');
  if (!uid || !hash) return show('bad', 'رابط التحقق ناقص.', 'This verification link is incomplete.');
  try {
    const res = await fetch(`${BASE}/api/query`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: 'invoices:verify', args: { uid, hash }, format: 'json' }) });
    const out = await res.json();
    if (out.status !== 'success') throw new Error('request failed');
    const r = out.value;
    if (!r.found) return show('bad', 'لم نجد فاتورة مطابقة في سجل المطعم. لو صدرت للتو، ربما لم تُرفع بعد — جرّب بعد قليل.',
      'No matching invoice in the restaurant records. If it was just issued it may not be uploaded yet; try again shortly.');

    if (r.status === 'void') show('warn', 'الفاتورة مسجّلة لدى المطعم لكنها ملغاة.', 'On record, but this invoice was cancelled.');
    else show('ok', 'الفاتورة مطابقة ✔', 'سليمة ومسجّلة لدى المطعم · Verified: matches the restaurant record');

    $('#nameAr').textContent = r.nameAr || 'مطابخ الجنوب للمأكولات الشعبية';
    $('#nameEn').textContent = r.nameEn || '';
    $('#cr').innerHTML = r.crNumber ? `السجل التجاري · C.R.&nbsp;<bdi>${esc(r.crNumber)}</bdi>` : '';
    const [y, m, d] = String(r.date).split('-');
    $('#meta').innerHTML = `
      <div><i>رقم الفاتورة · No.</i><b class="num">${esc(r.no)}</b></div>
      <div><i>التاريخ · Date</i><b class="num">${esc(`${d}/${m}/${y} · ${r.time}`)}</b></div>
      <div><i>الدفع · Payment</i><b>${esc(PAY[r.type] || r.type)}</b></div>
      <div><i>الحالة · Status</i><b>${r.status === 'void' ? 'ملغاة · Cancelled' : 'سارية · Valid'}</b></div>`;
    $('#items').innerHTML = r.items.map(it => `<tr>
      <td>${esc(it.ar)}${it.en ? `<small>${esc(it.en)}</small>` : ''}</td>
      <td class="n num">${esc(it.qty)} × ${money(it.price)}</td>
      <td class="n num">${money(it.qty * it.price)}</td></tr>`).join('');
    const row = (ar, en, v, cls = '') => `<div class="${cls}"><span>${ar} · ${en}</span><span class="num">${v}</span></div>`;
    $('#sum').innerHTML =
      row('المجموع', 'Subtotal', money(r.subtotal)) +
      (r.discount > 0 ? row('الخصم', 'Discount', '−' + money(r.discount)) : '') +
      (r.delivery > 0 ? row('التوصيل', 'Delivery', money(r.delivery)) : '') +
      (r.vat > 0 ? row(`الضريبة ${esc(r.vatRate)}%`, 'VAT', money(r.vat)) : '') +
      (r.deposit > 0 ? row('العربون المدفوع', 'Deposit paid', '−' + money(r.deposit)) : '') +
      row('الإجمالي', 'Total', money(r.total) + ' QAR', 'total');
    $('#fp').innerHTML = `<br>بصمة التحقق · Fingerprint <code>${esc(r.hash)}</code> — طابقها مع المطبوعة على الفاتورة`;
    $('#invoice').hidden = false;
  } catch (e) {
    show('wait', 'تعذّر الاتصال الآن. تحقق من الإنترنت وحاول مرة أخرى.', 'Could not connect. Check the internet and try again.');
  }
})();
</script>
</body>
</html>

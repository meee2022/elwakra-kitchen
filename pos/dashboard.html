<!DOCTYPE html>
<html lang="ar" dir="rtl" class="auth-pending">
<head>
<style>html.auth-pending body>:not(#authGate){display:none!important}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متابعة المبيعات — مطابخ الجنوب</title>
<meta name="theme-color" content="#A63C22">
<link rel="icon" href="icons/favicon.png">
<link rel="stylesheet" href="fonts/cairo.css?v=25">
<script src="i18n.js?v=25"></script>
<style>
:root{
  --brand:#A63C22; --brand-dark:#7C2D17; --cream:#FAF6F1; --paper:#fff;
  --ink:#2A211D; --muted:#8A7C74; --line:#E6DCD3;
  --ok:#1E7A4B; --warn:#B4791A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);
     font-family:"Segoe UI",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.55}
header{background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;
       padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:9}
header .logo{width:40px;height:40px;border-radius:50%;background:#2E2521;display:grid;
  place-items:center;font-weight:700;font-size:12px;border:2px solid rgba(255,255,255,.8);flex:none}
header h1{margin:0;font-size:16px;font-weight:800}
header .sub{font-size:11px;opacity:.85}
main{padding:14px;max-width:900px;margin:0 auto}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;
      box-shadow:0 1px 2px rgba(42,33,29,.06);margin-bottom:14px;overflow:hidden}
.card-h{padding:11px 15px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;
        display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-b{padding:15px}

label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
input,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;
             background:var(--paper);outline:none;font-family:inherit;font-size:15px}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(166,60,34,.12)}
.btn{border:1px solid var(--line);background:var(--paper);padding:10px 16px;border-radius:10px;
     font-weight:600;font-family:inherit;font-size:14px;cursor:pointer}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.right{margin-inline-start:auto}
.muted{color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--brand)}
.stat.g::before{background:var(--ok)} .stat.w::before{background:var(--warn)}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600}
.stat .v{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:11px;color:var(--muted)}

table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);font-size:13.5px}
th{background:var(--cream);font-size:12px;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums;direction:ltr;text-align:center}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;min-width:44px}
.bar div{height:100%;background:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);padding:6px 13px;border-radius:999px;
      font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.msg{padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:12px}
.msg.err{background:#FBEAE9;border:1px solid #f0cfcd;color:#B3261E}
.msg.info{background:#FCF3E2;border:1px solid #f0dfba;color:#7a5410}
.empty{padding:28px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
/* Match the POS workspace without changing dashboard behavior. */
:root{--paper:#FDFBFA;--cream:#F7F3EF;--muted:#6A5E55;--line:#DDD6CF}
body{font-family:'Cairo',Tahoma,sans-serif}
header{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--line);padding:18px 24px}
header .logo{color:var(--paper);border:0;border-radius:11px;background:var(--brand-dark)}
header .sub{color:var(--muted);margin-top:4px}
main{max-width:1120px;padding:28px 24px}
.card{box-shadow:none;border-radius:14px;margin-bottom:20px}
.card-h{padding:16px 18px}
.card-b{padding:20px}
.stat{padding:20px;box-shadow:none}
.stat::before{display:none}
.stat .v{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:20px;font-weight:700;line-height:1.5;margin-top:6px}
.stat-currency{font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}
.stat-number{min-width:0;overflow-wrap:anywhere}
@media(max-width:600px){.stat .v{font-size:18px}}
.btn,.chip{min-height:40px}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
#btnRefresh{background:var(--cream)!important;border-color:var(--line)!important;color:var(--brand)!important}
@media(max-width:600px){main{padding:18px 14px}header{padding:14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:14px}}

input,select,.card,.row,.stat{min-width:0;max-width:100%}
.stat .v,.msg{overflow-wrap:anywhere}
@media(max-width:600px){
  input,select{font-size:16px;min-height:44px}
  .btn,.chip{min-height:44px;max-width:100%;white-space:normal}
  header{flex-wrap:wrap}
  .card-b{padding:14px}
  .card-h{padding:12px 14px}
  .row>div{max-width:100%}
  table{min-width:420px}
}
@media(max-height:650px){header{position:static}}

/* Accounts */
.btn-sm{padding:6px 11px;font-size:12.5px;min-height:34px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#E7F4EC;color:var(--ok)}
.pill.off{background:#FBEAE9;color:#B3261E}
.msg.ok{background:#E7F4EC;border:1px solid #CFE6D8;color:var(--ok)}
.acct-acts{white-space:nowrap}
.acct-acts .btn{margin-inline-start:6px}
.acct-form{border-top:1px solid var(--line)}
.acct-title{font-weight:700;font-size:14px;margin-bottom:12px}
.acct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.acct-grid small{display:block;margin-top:4px;font-size:11.5px;color:var(--muted)}
</style>
<link rel="stylesheet" href="auth.css?v=25">
</head>
<body>

<header>
  <div class="logo">STDK</div>
  <div style="flex:1;min-width:0">
    <h1 data-i18n="متابعة المبيعات">متابعة المبيعات</h1>
    <div class="sub" data-i18n="مطابخ الجنوب للمأكولات الشعبية">مطابخ الجنوب للمأكولات الشعبية</div>
  </div>
  <button class="btn" id="btnLang" type="button" style="margin-inline-end:8px">English</button>
  <button class="btn" id="btnRefresh" style="background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff" hidden data-i18n="تحديث">تحديث</button>
</header>

<main>

<div id="setup" hidden></div>

<div id="board" hidden>
  <div class="card">
    <div class="card-h">
      <bdi data-i18n="الفترة">الفترة</bdi>
      <div class="chips right" id="quick">
        <button class="chip on" data-q="today" data-i18n="اليوم">اليوم</button>
        <button class="chip" data-q="week" data-i18n="آخر 7 أيام">آخر 7 أيام</button>
        <button class="chip" data-q="month" data-i18n="هذا الشهر">هذا الشهر</button>
        <button class="chip" data-q="year" data-i18n="هذه السنة">هذه السنة</button>
      </div>
    </div>
    <div class="card-b row">
      <div style="flex:1;min-width:130px"><label data-i18n="من">من</label><input type="date" id="from"></div>
      <div style="flex:1;min-width:130px"><label data-i18n="إلى">إلى</label><input type="date" id="to"></div>
    </div>
  </div>

  <div id="boardMsg"></div>
  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="card-h" data-i18n="الأصناف الأكثر مبيعاً">الأصناف الأكثر مبيعاً</div>
    <div style="max-height:60vh;overflow:auto">
      <table><thead><tr><th style="width:34px">#</th><th data-i18n="الصنف">الصنف</th>
        <th style="width:60px" data-i18n="الكمية">الكمية</th><th style="width:88px" data-i18n="القيمة">القيمة</th><th style="width:80px"></th></tr></thead>
        <tbody id="items"></tbody></table>
    </div>
  </div>

  <div class="card">
    <div class="card-h" data-i18n="المبيعات اليومية">المبيعات اليومية</div>
    <div style="max-height:50vh;overflow:auto">
      <table><thead><tr><th data-i18n="التاريخ">التاريخ</th><th style="width:64px" data-i18n="فواتير">فواتير</th>
        <th style="width:64px" data-i18n="وجبات">وجبات</th><th style="width:96px" data-i18n="الإجمالي">الإجمالي</th></tr></thead>
        <tbody id="days"></tbody></table>
    </div>
  </div>

  <div class="card">
    <div class="card-h" data-i18n="الحسابات">الحسابات</div>
    <div style="overflow:auto">
      <table><thead><tr><th data-i18n="اسم المستخدم">اسم المستخدم</th><th style="width:110px" data-i18n="الدور">الدور</th>
        <th style="width:110px" data-i18n="الحالة">الحالة</th><th style="width:260px"></th></tr></thead>
        <tbody id="accounts"></tbody></table>
    </div>
    <form class="card-b acct-form" id="acctForm" autocomplete="off">
      <div class="acct-title" id="acctTitle"></div>
      <div class="acct-grid">
        <div data-for="add"><label for="acctUser" data-i18n="اسم المستخدم">اسم المستخدم</label>
          <input id="acctUser" dir="ltr" maxlength="40" autocapitalize="none" spellcheck="false" autocomplete="off">
          <small data-i18n="حروف إنجليزية صغيرة وأرقام">حروف إنجليزية صغيرة وأرقام</small></div>
        <div data-for="add"><label for="acctRole" data-i18n="الدور">الدور</label>
          <select id="acctRole"><option value="cashier" data-i18n="كاشير">كاشير</option><option value="manager" data-i18n="مدير">مدير</option></select></div>
        <div data-for="add password"><label for="acctNew" data-i18n="كلمة المرور الجديدة">كلمة المرور الجديدة</label>
          <input id="acctNew" type="password" dir="ltr" maxlength="256" autocomplete="new-password">
          <small data-i18n="8 حروف على الأقل">8 حروف على الأقل</small></div>
        <div data-for="add password"><label for="acctNew2" data-i18n="تأكيد كلمة المرور">تأكيد كلمة المرور</label>
          <input id="acctNew2" type="password" dir="ltr" maxlength="256" autocomplete="new-password"></div>
        <div><label for="acctMine" data-i18n="كلمة مرورك الحالية (للتأكيد)">كلمة مرورك الحالية (للتأكيد)</label>
          <input id="acctMine" type="password" dir="ltr" maxlength="256" autocomplete="current-password"></div>
      </div>
      <div id="acctMsg" role="status" aria-live="polite"></div>
      <div class="row">
        <button class="btn btn-primary" id="acctSave" type="submit"></button>
        <button class="btn" id="acctCancel" type="button" data-i18n="إلغاء">إلغاء</button>
      </div>
    </form>
  </div>

  <div class="row" style="margin-bottom:24px">
    <button class="btn" id="btnLogout" data-i18n="تغيير بيانات الاتصال">تغيير بيانات الاتصال</button>
    <span class="muted right" id="lastSync" style="font-size:12px"></span>
  </div>
</div>

</main>

<script src="auth.js?v=25"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const KEY = 'stdk_dashboard';
const money = n => (Math.round(Number(n || 0) * 100) / 100)
  .toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayISO = () => new Date().toLocaleDateString('en-CA');
const fmtDate = iso => { const [y,m,d] = String(iso).split('-'); return `${d}/${m}/${y}`; };

let cfg = null;

async function call(path, args, kind) { return Auth.call(path, args, kind); }
$('#btnLogout').textContent='خروج / Sign out';
$('#btnLogout').removeAttribute('data-i18n');
$('#btnLogout').addEventListener('click',()=>Auth.logout());
addEventListener('auth-locked',()=>{cfg=null;$('#board').hidden=true;$('#stats').innerHTML='';$('#items').innerHTML='';$('#accounts').innerHTML='';});

function msg(sel, text, kind) {
  $(sel).innerHTML = text ? `<div class="msg ${kind || 'info'}">${text}</div>` : '';
}

/* ---------- الفترة ---------- */
function setQuick(q) {
  const t = todayISO();
  if (q === 'today') { $('#from').value = t; $('#to').value = t; }
  else if (q === 'week') { const d = new Date(); d.setDate(d.getDate() - 6);
    $('#from').value = d.toLocaleDateString('en-CA'); $('#to').value = t; }
  else if (q === 'month') { $('#from').value = t.slice(0, 8) + '01'; $('#to').value = t; }
  else { $('#from').value = t.slice(0, 4) + '-01-01'; $('#to').value = t; }
}
$('#quick').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
  setQuick(b.dataset.q);
  refresh();
});
['#from', '#to'].forEach(s => $(s).addEventListener('change', refresh));
$('#btnRefresh').addEventListener('click', refresh);

/* ---------- العرض ---------- */
function showBoard() {
  $('#setup').hidden = true;
  $('#board').hidden = false;
  $('#btnRefresh').hidden = false;
  setQuick('today');
  refresh();
  setAcct('add');
  loadAccounts();
}

const statValue = value => {
  const text = String(value);
  const cur = ' ' + t('ر.ق');   // the unit follows the interface language
  return text.endsWith(cur)
    ? `<bdi class="stat-number" dir="ltr">${esc(text.slice(0, -cur.length))}</bdi><span class="stat-currency">${t('ر.ق')}</span>`
    : `<bdi class="stat-number" dir="ltr">${esc(text)}</bdi>`;
};
const stat = (l, v, s, cls) =>
  `<div class="stat ${cls || ''}"><div class="l">${l}</div><div class="v">${statValue(v)}</div><div class="s">${s || '&nbsp;'}</div></div>`;

async function refresh() {
  if (!cfg) return;
  msg('#boardMsg', t('جاري التحميل…'), 'info');
  try {
    const r = await call('invoices:summary', { from: $('#from').value, to: $('#to').value });
    msg('#boardMsg', '');

    $('#stats').innerHTML =
      stat(t('إجمالي المبيعات'), money(r.total) + ' ' + t('ر.ق'), r.invoices + ' ' + t('فاتورة')) +
      stat(t('عدد الوجبات المباعة'), r.units, t('وحدة'), 'g') +
      stat(t('بطاقة'), money(r.card) + ' ' + t('ر.ق'), '', 'g') +
      stat(t('نقداً'), money(r.cash) + ' ' + t('ر.ق'), '', 'g') +
      stat(t('على الحساب'), money(r.credit) + ' ' + t('ر.ق'), t('غير محصّل: ') + money(r.unpaid), 'w') +
      stat(t('متوسط الفاتورة'), money(r.invoices ? r.total / r.invoices : 0) + ' ' + t('ر.ق'), '') +
      stat(t('فواتير ملغاة'), r.voided, '');

    const max = r.topItems.length ? r.topItems[0].qty : 1;
    $('#items').innerHTML = r.topItems.length
      ? r.topItems.map((it, i) => `<tr>
          <td class="num">${i + 1}</td><td>${esc(it.ar)}</td>
          <td class="num"><b>${it.qty}</b></td><td class="num">${money(it.val)}</td>
          <td><div class="bar"><div style="width:${(it.qty / max * 100).toFixed(1)}%"></div></div></td>
        </tr>`).join('')
      : '<tr><td colspan="5"><div class="empty" data-i18n="لا توجد مبيعات في هذه الفترة">لا توجد مبيعات في هذه الفترة</div></td></tr>';

    $('#days').innerHTML = r.days.length
      ? r.days.map(d => `<tr><td class="num">${fmtDate(d.date)}</td><td class="num">${d.n}</td>
          <td class="num">${d.units}</td><td class="num"><b>${money(d.total)}</b></td></tr>`).join('')
      : '<tr><td colspan="4"><div class="empty" data-i18n="لا توجد بيانات">لا توجد بيانات</div></td></tr>';

    $('#lastSync').textContent = r.lastSync
      ? t('آخر فاتورة وصلت: ') + new Date(r.lastSync).toLocaleString(I18n.get() === 'en' ? 'en-GB' : 'ar-QA')
      : t('لم تصل أي فاتورة بعد');
    I18n.applyStatic();   // النصوص الموسومة داخل الجداول المرسومة حديثاً
  } catch (e) {
    msg('#boardMsg', t('تعذّر التحميل: ') + esc(e.message), 'err');
  }
}

/* ---------- الحسابات ---------- */
// One form serves the four changes; every one of them is confirmed with the manager's own password.
let acct = { mode: 'add', username: '' };   // add | password | disable | enable
const ACCT_ERRORS = {
  WRONG_PASSWORD: 'كلمة مرورك الحالية غير صحيحة.',
  TOO_MANY_ATTEMPTS: 'محاولات كثيرة. انتظر 15 دقيقة ثم حاول مرة أخرى.',
  USERNAME_TAKEN: 'اسم المستخدم مستخدم بالفعل.',
  INVALID_USERNAME: 'اسم المستخدم: من 3 إلى 40 حرفاً إنجليزياً صغيراً أو رقماً.',
  WEAK_PASSWORD: 'كلمة المرور يجب ألا تقل عن 8 حروف.',
  NOT_FOUND: 'الحساب غير موجود.',
  CANNOT_DISABLE_SELF: 'لا يمكنك إيقاف حسابك أنت.'
};
function setAcct(mode, username) {
  acct = { mode, username: username || '' };
  $('#acctForm').reset();
  document.querySelectorAll('#acctForm [data-for]').forEach(el => { el.hidden = !el.dataset.for.split(' ').includes(mode); });
  $('#acctTitle').textContent = mode === 'add' ? t('إضافة حساب جديد')
    : t({ password: 'تغيير كلمة مرور الحساب:', disable: 'إيقاف الحساب:', enable: 'تفعيل الحساب:' }[mode]) + ' ' + acct.username;
  $('#acctSave').textContent = t({ add: 'إضافة الحساب', password: 'تغيير كلمة المرور', disable: 'إيقاف الحساب', enable: 'تفعيل الحساب' }[mode]);
  $('#acctCancel').hidden = mode === 'add';
}
async function loadAccounts() {
  try {
    const list = await call('authSessions:accounts'), me = Auth.profile().username;
    $('#accounts').innerHTML = list.map(a => `<tr>
      <td><bdi dir="ltr">${esc(a.username)}</bdi>${a.username === me ? ` <span class="muted">(${t('أنت')})</span>` : ''}</td>
      <td>${t(a.role === 'manager' ? 'مدير' : 'كاشير')}</td>
      <td><span class="pill ${a.disabled ? 'off' : ''}">${t(a.disabled ? 'موقوف' : 'مفعّل')}</span></td>
      <td class="acct-acts"><button class="btn btn-sm" type="button" data-acct="password" data-user="${esc(a.username)}">${t('تغيير كلمة المرور')}</button>${
        a.username === me ? '' : `<button class="btn btn-sm" type="button" data-acct="${a.disabled ? 'enable' : 'disable'}" data-user="${esc(a.username)}">${t(a.disabled ? 'تفعيل' : 'إيقاف')}</button>`}</td>
    </tr>`).join('');
  } catch (e) {
    msg('#acctMsg', t('تعذّر تحميل الحسابات: ') + esc(e.message), 'err');
  }
}
$('#accounts').addEventListener('click', e => {
  const b = e.target.closest('[data-acct]');
  if (!b) return;
  setAcct(b.dataset.acct, b.dataset.user);
  msg('#acctMsg', b.dataset.acct === 'disable' ? t('إيقاف الحساب يمنع صاحبه من الدخول فوراً، ويمكن تفعيله لاحقاً.') : '', 'info');
  $(b.dataset.acct === 'password' ? '#acctNew' : '#acctMine').focus();
});
$('#acctCancel').addEventListener('click', () => { msg('#acctMsg', ''); setAcct('add'); });
$('#acctForm').addEventListener('submit', async e => {
  e.preventDefault();
  const { mode, username } = acct, fresh = $('#acctNew').value, password = $('#acctMine').value;
  if (mode === 'add' || mode === 'password') {
    if (fresh.length < 8) return msg('#acctMsg', t(ACCT_ERRORS.WEAK_PASSWORD), 'err');
    if (fresh !== $('#acctNew2').value) return msg('#acctMsg', t('كلمتا المرور غير متطابقتين.'), 'err');
  }
  if (!password) return msg('#acctMsg', t('اكتب كلمة مرورك الحالية للتأكيد.'), 'err');
  $('#acctSave').disabled = true;
  try {
    if (mode === 'add') await call('auth:createAccount', { password, username: $('#acctUser').value, role: $('#acctRole').value, newPassword: fresh }, 'action');
    else if (mode === 'password') await call('auth:setPassword', { password, username, newPassword: fresh }, 'action');
    else await call('auth:setDisabled', { password, username, disabled: mode === 'disable' }, 'action');
    // Changing your own password closes your sessions too: back to the sign-in screen.
    if (mode === 'password' && username === Auth.profile().username) return location.reload();
    setAcct('add');
    msg('#acctMsg', t('تم الحفظ.'), 'ok');
    loadAccounts();
  } catch (err) {
    const code = Object.keys(ACCT_ERRORS).find(k => err.message.includes(k));
    msg('#acctMsg', code ? t(ACCT_ERRORS[code]) : t('تعذّر الحفظ: ') + esc(err.message), 'err');
  } finally {
    $('#acctSave').disabled = false;
  }
});

/* ---------- اللغة ---------- */
const LANG_KEY = 'stdk_lang';   // shared with the sign-in screen and the till
$('#btnLang').addEventListener('click', () => {
  const next = I18n.get() === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
  I18n.set(next, () => { if (cfg && !$('#board').hidden) { refresh(); setAcct(acct.mode, acct.username); loadAccounts(); } });
});

/* ---------- التشغيل ---------- */
let savedLang = 'ar';
try { savedLang = localStorage.getItem(LANG_KEY) || 'ar'; } catch (e) {}
I18n.set(savedLang);
Auth.require(true).then(profile=>{cfg=profile;showBoard();});
</script>
